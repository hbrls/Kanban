[package]
name = "routa-desktop"
version = "0.19.0"
description = "Routa.js Desktop - Multi-agent coordination platform"
authors = ["phodal"]
edition = "2021"

[lib]
name = "routa_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Tauri plugins
tauri = { version = "=2.10.2", features = ["tray-icon", "devtools", "image-png"] }
tauri-runtime = "=2.10.0"
tauri-runtime-wry = { version = "=2.10.0", default-features = false }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-sql = { version = "=2.4.1", features = ["sqlite"] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-os = "=2.3.2"
tauri-plugin-opener = "=2.5.5"

# Core dependencies
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=6.0.0"

# PTY support for interactive terminals
portable-pty = "=0.9.0"

# Routa Server (extracted crate)
routa-server = { path = "../../../crates/routa-server" }

# Async runtime (needed for Tauri integration)
tokio = { version = "=1.53.1", features = ["full"] }
reqwest = { version = "=0.12.28", features = ["json", "socks"] }

[dev-dependencies]
axum = "=0.8.9"
reqwest = { version = "=0.12.28", features = ["json"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
