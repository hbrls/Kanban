[package]
name = "acp-manager"
version = "0.19.0"
description = "ACP agent process, session, provider, and trace management"
authors = ["phodal"]
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
dirs = "6"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.26.0"
