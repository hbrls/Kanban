[workspace]
resolver = "2"
members = [
    "crates/feature-trace",
    "crates/routa-core",
    "crates/routa-server",
    "crates/routa-cli",
    "crates/routa-rpc",
    "crates/routa-scanner",
    "crates/trace-parser",
    "crates/entrix",
    "apps/desktop/src-tauri",
    "crates/harness-monitor",
]

[workspace.package]
version = "0.19.0"
edition = "2021"
license = "MIT"
authors = ["phodal"]

# Agent 为主的工作流：不打断点，只依赖 panic backtrace 的文件名+行号定位失败
[profile.dev]
debug = "line-tables-only"

# 依赖开优化加速测试执行；自身 crate 保持 opt-level = 0 以保留增量编译速度
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# spec detector 依赖 catch_unwind 将单个探测器失败降级为 warning
panic = "unwind"
strip = "symbols"
